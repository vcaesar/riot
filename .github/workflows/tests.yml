on:
  push:
    branches:
      - main
  pull_request:
name: Tests
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: |
          go version
          go test -race ./...
