on:
  push:
    branches:
      - main
  pull_request:
name: Tests
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Test
        run: |
          go version
          go test -run '^TestTextFieldReleaseAllocations$' .
          go test -race ./...
          go test '-coverprofile=coverage.out' ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
          flags: ${{ matrix.platform }}
      - name: Build 32-bit
        if: matrix.platform == 'ubuntu-latest'
        run: |
          for arch in 386 arm mipsle; do GOOS=linux GOARCH=$arch go vet ./...; done
          GOARCH=386 go test ./hnsw/...
