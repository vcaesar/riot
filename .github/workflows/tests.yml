on:
  push:
    branches:
      - main
  pull_request:
name: Tests
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go version
          go test -race ./...
